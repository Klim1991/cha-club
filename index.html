<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🍵 Чайный Клуб - ChuClub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a2a1f 0%, #2d4a3a 30%, #f5f5e8 70%, #e8f0e0 100%);
            color: #2d4030;
            position: relative;
        }

        .container {
            width: 100vw;
            height: 100vh;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            overflow: hidden;
            position: relative;
        }

        /* WELCOME SCREEN */
        #welcomeScreen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 25px;
            background: linear-gradient(135deg, rgba(74,111,58,0.1) 0%, rgba(248,244,232,0.95) 100%);
        }

        .tea-logo {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(135deg, #4a6f3a, #7ba05c, #9bb85c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px rgba(74,111,58,0.3); }
            to { text-shadow: 0 0 25px rgba(74,111,58,0.6); }
        }

        .welcome-subtitle {
            font-size: 18px;
            color: #4a5d40;
            margin-bottom: 50px;
            line-height: 1.6;
            max-width: 320px;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            width: 100%;
            max-width: 400px;
            padding: 0 20px;
        }

        .nav-btn {
            background: linear-gradient(145deg, rgba(255,255,255,0.95), rgba(248,255,248,0.9));
            border: 3px solid rgba(74,111,58,0.3);
            padding: 30px 20px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            color: #2d4030;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 15px 40px rgba(74,111,58,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .nav-btn:hover {
            transform: translateY(-12px) scale(1.03);
            border-color: #4a6f3a;
            box-shadow: 0 30px 60px rgba(74,111,58,0.35);
        }

        .nav-icon {
            font-size: 36px;
        }

        /* SECTIONS */
        .section {
            display: none;
            height: 100vh;
            overflow-y: auto;
            padding: 80px 25px 25px;
        }

        .section.active {
            display: block;
        }

        .back-btn {
            position: fixed;
            top: 25px;
            left: 25px;
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            border: 3px solid rgba(74,111,58,0.3);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            font-weight: 600;
            color: #2d4030;
            cursor: pointer;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 35px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            transform: scale(1.1);
            border-color: #4a6f3a;
            box-shadow: 0 15px 45px rgba(74,111,58,0.4);
        }

        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 25px;
            border-bottom: 4px solid rgba(74,111,58,0.25);
        }

        .section-icon {
            width: 60px;
            height: 60px;
            border-radius: 20px;
            background: linear-gradient(135deg, #4a6f3a, #7ba05c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            margin-right: 25px;
            box-shadow: 0 15px 40px rgba(74,111,58,0.4);
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            color: #2d4030;
        }

        /* TEA CARDS */
        .tea-card {
            background: rgba(255,255,255,0.92);
            border-radius: 30px;
            padding: 40px;
            margin-bottom: 35px;
            border: 2px solid rgba(74,111,58,0.15);
            box-shadow: 0 20px 55px rgba(0,0,0,0.12);
            transition: all 0.4s ease;
            backdrop-filter: blur(15px);
        }

        .tea-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 35px 70px rgba(74,111,58,0.25);
            border-color: rgba(74,111,58,0.3);
        }

        .tea-name {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: #2d4030;
            margin-bottom: 20px;
        }

        /* INPUTS */
        .input-group {
            margin-bottom: 30px;
        }

        .input-group label {
            display: block;
            margin-bottom: 12px;
            font-weight: 600;
            color: #4a5d40;
            font-size: 16px;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 22px;
            border: 3px solid rgba(74,111,58,0.2);
            border-radius: 25px;
            font-size: 16px;
            background: rgba(255,255,255,0.95);
            color: #2d4030;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .input-group input:focus, .input-group textarea:focus {
            outline: none;
            border-color: #4a6f3a;
            box-shadow: 0 0 0 4px rgba(74,111,58,0.15);
        }

        /* BUTTONS */
        .btn-primary {
            background: linear-gradient(135deg, #4a6f3a, #7ba05c);
            color: white;
            border: none;
            padding: 25px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 20px 50px rgba(74,111,58,0.35);
            transition: all 0.4s ease;
            font-family: inherit;
        }

        .btn-primary:hover {
            transform: translateY(-6px);
            box-shadow: 0 30px 70px rgba(74,111,58,0.45);
        }

        /* POSTS */
        .post {
            background: rgba(255,255,255,0.95);
            border-radius: 30px;
            padding: 35px;
            margin-bottom: 35px;
            border: 2px solid rgba(74,111,58,0.1);
            box-shadow: 0 15px 50px rgba(0,0,0,0.12);
        }

        .post-avatar {
            width: 60px;
            height: 60px;
            border-radius: 20px;
            background: linear-gradient(135deg, #4a6f3a, #7ba05c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 22px;
            color: white;
            margin-right: 20px;
        }

        .action-btn {
            background: rgba(74,111,58,0.12);
            border: 2px solid rgba(74,111,58,0.3);
            padding: 16px 24px;
            border-radius: 25px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #2d4030;
            transition: all 0.3s ease;
            flex: 1;
        }

        .action-btn:hover {
            background: rgba(74,111,58,0.25);
            transform: translateY(-3px);
        }

        .action-btn.active {
            background: linear-gradient(135deg, #4a6f3a, #7ba05c);
            color: white;
            border-color: #4a6f3a;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(45,64,48,0.9);
            z-index: 9999;
            backdrop-filter: blur(20px);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.98);
            padding: 45px;
            border-radius: 35px;
            border: 3px solid rgba(74,111,58,0.25);
            max-width: 95%;
            max-height: 90%;
            overflow-y: auto;
            box-shadow: 0 40px 100px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Главный экран -->
        <div id="welcomeScreen">
            <div class="tea-logo">🍵 Чайный Клуб</div>
            <p class="welcome-subtitle">Добро пожаловать в уютный мир китайских чаев</p>
            <div class="nav-grid">
                <button class="nav-btn" onclick="showSection('teas')">
                    <div class="nav-icon">🍵</div>
                    <strong>Виды чая</strong>
                </button>
                <button class="nav-btn" onclick="showSection('meditations')">
                    <div class="nav-icon">🧘</div>
                    <strong>Медитации</strong>
                </button>
                <button class="nav-btn" onclick="showSection('feed')">
                    <div class="nav-icon">💬</div>
                    <strong>Чат</strong>
                </button>
                <button class="nav-btn" onclick="showSection('profile')">
                    <div class="nav-icon">👤</div>
                    <strong>Профиль</strong>
                </button>
            </div>
        </div>

        <!-- Кнопка назад -->
        <button class="back-btn" id="backBtn" onclick="showWelcome()" style="display: none;">←</button>

        <!-- Виды чая -->
        <div id="teas" class="section">
            <div class="section-header">
                <div class="section-icon">🍵</div>
                <h2 class="section-title">Виды чая</h2>
            </div>
            <div id="teaList"></div>
        </div>

        <!-- Медитации -->
        <div id="meditations" class="section">
            <div class="section-header">
                <div class="section-icon">🧘</div>
                <h2 class="section-title">Медитации</h2>
            </div>
            <div id="meditationsList"></div>
        </div>

        <!-- Чат -->
        <div id="feed" class="section">
            <div class="section-header">
                <div class="section-icon">💬</div>
                <h2 class="section-title">Общий чат</h2>
            </div>
            <div id="postsList" style="max-height: 60vh; overflow-y: auto; margin-bottom: 30px;"></div>
            <div class="input-group">
                <textarea id="newPost" placeholder="Поделитесь впечатлениями о чае..." rows="4"></textarea>
            </div>
            <button class="btn-primary" onclick="addPost()">Опубликовать</button>
        </div>

        <!-- Профиль -->
        <div id="profile" class="section">
            <div class="section-header">
                <div class="section-icon">👤</div>
                <h2 class="section-title">Профиль</h2>
            </div>
            <div class="profile-grid" style="display: grid; grid-template-columns: 100px 1fr; gap: 30px; align-items: center; margin-bottom: 40px; background: rgba(255,255,255,0.9); padding: 40px; border-radius: 30px; border: 2px solid rgba(74,111,58,0.15);">
                <div class="profile-avatar" id="profileAvatar" style="width: 100px; height: 100px; border-radius: 25px; background: linear-gradient(135deg, #7ba05c, #9bb85c); display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 700; color: white; cursor: pointer;">
                    <span id="avatarText">К</span>
                </div>
                <div>
                    <h3 id="profileName" style="font-family: 'Playfair Display', serif; font-size: 28px; margin-bottom: 10px;">Клим Чайный</h3>
                    <p id="profileBio" style="color: #5a6f4e; font-size: 17px;">Любитель китайского чая</p>
                </div>
            </div>

            <div class="input-group">
                <label>Имя</label>
                <input type="text" id="editName">
            </div>
            <div class="input-group">
                <label>О себе</label>
                <textarea id="editBio" rows="4"></textarea>
            </div>
            <button class="btn-primary" onclick="saveProfile()">Сохранить</button>
        </div>

        <!-- Модал комментариев -->
        <div id="commentsModal" class="modal" onclick="if(event.target.classList.contains('modal')) closeComments()">
            <div class="modal-content">
                <div class="section-header" style="justify-content: space-between;">
                    <div style="display: flex; align-items: center;">
                        <div class="section-icon">💬</div>
                        <h2 class="section-title" id="modalTitle">Комментарии</h2>
                    </div>
                    <button class="back-btn" onclick="closeComments()" style="position: static; margin-left: auto;">×</button>
                </div>
                <div id="commentsList" style="max-height: 50vh; overflow-y: auto; margin-bottom: 30px;"></div>
                <div class="input-group">
                    <textarea id="newComment" placeholder="Ваш комментарий..." rows="3"></textarea>
                </div>
                <button class="btn-primary" onclick="addComment()">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        // Глобальные переменные
        let tg = window.Telegram.WebApp;
        let currentUser = {
            id: tg.initDataUnsafe?.user?.id || 12345,
            name: (tg.initDataUnsafe?.user?.first_name || '') + ' ' + (tg.initDataUnsafe?.user?.last_name || '') || 'Клим Чайный',
            bio: 'Любитель китайского чая'
        };
        let currentPostId = null;
        let posts = [
            {id: 1, userId: 1, user: 'Чай Мастер', avatar: 'Ч', text: 'Шу Пуэр 2018 раскрылся великолепно! Насыщенный вкус с нотками чернослива.', likes: 12, liked: false, comments: []},
            {id: 2, userId: 2, user: 'Листок', avatar: 'Л', text: 'Лапсанг Сушонг - удивительный копченый аромат!', likes: 8, liked: false, comments: []}
        ];
        let teas = [
            {name: 'Зелёный чай', description: 'Свежий вкус с травяными нотками. Минимальная ферментация сохраняет природную свежесть.', brewing: '75-85°C • 1-3 мин • Гайвань'},
            {name: 'Белый чай', description: 'Нежный сладковатый вкус с цветочными оттенками. Весенний сбор без ферментации.', brewing: '75-85°C • 1-2 мин • Стеклянный чайник'},
            {name: 'Улун', description: 'Богатый вкус от цветочного до фруктового. Частично ферментированный.', brewing: '85-95°C • 20-60 сек • Пиалы'},
            {name: 'Пуэр', description: 'Глубокий землистый вкус. Постферментация придаёт уникальные нотки.', brewing: '95-100°C • 10-30 сек • Чайник 150 мл'}
        ];
        let meditations = [
            {title: '🌿 Утренний ритуал', artist: 'Chinmaya Dunster', duration: '6:52', src: 'https://ramayoga.ru/wp-content/uploads/2020/03/Chinmaya_Dunster_-_Scent_Meditation_-_Klub_yogi_OUM_RU_oum_ru.mp3'},
            {title: '🍃 Вечерний покой', artist: 'Поющие чаши', duration: '7:04', src: 'https://ramayoga.ru/wp-content/uploads/2020/03/Vamadeva_-_Napohnennost_oum_ru.mp3'},
            {title: '💚 Гармония сердца', artist: 'Vamadeva', duration: '4:11', src: 'https://ramayoga.ru/wp-content/uploads/2020/03/Chinmaya_Dunster_-_Touch_Meditation_-_Klub_yogi_OUM_RU_oum_ru.mp3'}
        ];

        // Инициализация
        tg.expand();
        document.addEventListener('DOMContentLoaded', initApp);

        function initApp() {
            tg.MainButton.setText('🏠 Главное меню').onClick(showWelcome).show();
            updateProfileDisplay();
            renderTeaList();
            renderMeditations();
            renderPosts();
        }

        function showWelcome() {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('welcomeScreen').style.display = 'flex';
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('commentsModal').style.display = 'none';
        }

        function showSection(sectionId) {
            console.log('Переход в раздел:', sectionId); // DEBUG
            document.getElementById('welcomeScreen').style.display = 'none';
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            document.getElementById('backBtn').style.display = 'block';
            document.getElementById('commentsModal').style.display = 'none';
        }

        function updateProfileDisplay() {
            document.getElementById('profileName').textContent = currentUser.name;
            document.getElementById('profileBio').textContent = currentUser.bio;
            document.getElementById('avatarText').textContent = currentUser.name[0] || 'К';
            document.getElementById('editName').value = currentUser.name;
            document.getElementById('editBio').value = currentUser.bio;
        }

        function saveProfile() {
            currentUser.name = document.getElementById('editName').value;
            currentUser.bio = document.getElementById('editBio').value;
            updateProfileDisplay();
            tg.showAlert('Профиль сохранён!');
        }

        function renderTeaList() {
            document.getElementById('teaList').innerHTML = teas.map(tea => `
                <div class="tea-card">
                    <h3 class="tea-name">${tea.name}</h3>
                    <p style="font-size: 17px; line-height: 1.7; color: #4a5d40; margin-bottom: 25px;">${tea.description}</p>
                    <div style="background: linear-gradient(135deg, rgba(74,111,58,0.08), rgba(123,160,92,0.08)); padding: 30px; border-radius: 25px; border-left: 6px solid #4a6f3a;">
                        <div style="font-weight: 700; margin-bottom: 15px; font-size: 18px;">🍵 Как заваривать:</div>
                        <div style="font-size: 17px; line-height: 1.6;">${tea.brewing}</div>
                    </div>
                </div>
            `).join('');
        }

        function renderMeditations() {
            document.getElementById('meditationsList').innerHTML = meditations.map(med => `
                <div class="tea-card">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px;">
                        <div>
                            <h3 style="font-family: 'Playfair Display', serif; font-size: 26px; margin-bottom: 8px;">${med.title}</h3>
                            <div style="color: #6b8e4a; font-size: 17px;">${med.artist} • ${med.duration}</div>
                        </div>
                    </div>
                    <audio controls style="width: 100%; height: 55px;" preload="metadata" src="${med.src}"></audio>
                </div>
            `).join('');
        }

        function renderPosts() {
            document.getElementById('postsList').innerHTML = posts.map(post => `
                <div class="post">
                    <div style="display: flex; align-items: center; margin-bottom: 25px;">
                        <div class="post-avatar">${post.avatar}</div>
                        <div style="flex: 1;">
                            <div style="font-weight: 700; font-size: 20px; margin-bottom: 5px;">${post.user}</div>
                            <div style="font-size: 15px; color: #8a9a7b;">${Math.floor(Math.random()*3)+1}ч назад</div>
                        </div>
                    </div>
                    <div style="font-size: 17px; line-height: 1.7; margin-bottom: 30px; color: #3a4a40;">${post.text}</div>
                    <div style="display: flex; gap: 20px; margin-bottom: 25px;">
                        <button class="action-btn ${post.liked ? 'active' : ''}" onclick="toggleLike(${post.id})">
                            ❤️ ${post.likes}
                        </button>
                        <button class="action-btn" onclick="openComments(${post.id})">
                            💬 ${post.comments.length}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function addPost() {
            const text = document.getElementById('newPost').value.trim();
            if (!text) return;
            
            posts.unshift({
                id: Date.now(),
                userId: currentUser.id,
                user: currentUser.name,
                avatar: currentUser.name[0],
                text,
                likes: 0,
                liked: false,
                comments: []
            });
            
            document.getElementById('newPost').value = '';
            renderPosts();
            tg.showAlert('Пост добавлен!');
        }

        function toggleLike(id) {
            const post = posts.find(p => p.id === id);
            post.liked = !post.liked;
            post.likes += post.liked ? 1 : -1;
            renderPosts();
        }

        function openComments(id) {
            currentPostId = id;
            const post = posts.find(p => p.id === id);
            document.getElementById('modalTitle').textContent = `Комментарии • ${post.user}`;
            document.getElementById('commentsModal').style.display = 'block';
        }

        function closeComments() {
            document.getElementById('commentsModal').style.display = 'none';
        }

        function addComment() {
            const text = document.getElementById('newComment').value.trim();
            if (!text || !currentPostId) return;
            
            const post = posts.find(p => p.id === currentPostId);
            post.comments.push({user: currentUser.name, text});
            document.getElementById('newComment').value = '';
            renderPosts();
        }
    </script>
</body>
</html>
