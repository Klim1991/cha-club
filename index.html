<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChaClub — Сообщество Чайных Мастеров</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #F5F5F3 0%, #E8F5E8 50%, #D2E8CF 100%);
            color: #2D5016; min-height: 100vh; padding-bottom: 80px;
        }
        .container { max-width: 400px; margin: 0 auto; padding: 20px; }
        .header { 
            text-align: center; padding: 20px 0; 
            background: rgba(255,248,220,0.8); border-radius: 20px; margin-bottom: 20px;
            border: 1px solid rgba(210,232,207,0.5);
        }
        h1 { font-size: 28px; background: linear-gradient(45deg, #8B4513, #228B22); 
             -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .screen { 
            background: rgba(255,255,255,0.9); border-radius: 20px; padding: 25px; 
            margin-bottom: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border: 1px solid rgba(210,232,207,0.5); display: none;
        }
        #mainScreen { display: block; }
        
        .btn { 
            background: linear-gradient(45deg, #228B22, #32CD32); color: white; 
            border: none; padding: 15px 20px; border-radius: 15px; 
            font-size: 16px; font-weight: bold; width: 100%; margin: 8px 0;
            transition: all 0.3s; cursor: pointer; box-shadow: 0 4px 15px rgba(34,139,34,0.3);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(34,139,34,0.4); }
        .btn-secondary { background: linear-gradient(45deg, #DAA520, #F4A460) !important; }
        .btn-outline { background: transparent !important; color: #228B22; border: 2px solid #228B22; }
        
        .post-card { 
            background: white; border-radius: 15px; padding: 20px; margin: 15px 0;
            border-left: 5px solid #228B22; box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            cursor: pointer;
        }
        .post-header { font-weight: bold; color: #8B4513; margin-bottom: 10px; }
        .post-tea { font-size: 16px; color: #228B22; margin-bottom: 8px; }
        .post-brew { background: #E8F5E8; padding: 8px; border-radius: 10px; font-weight: bold; }
        .post-actions { display: flex; justify-content: space-between; margin-top: 15px; }
        .action-btn { background: none; border: none; font-size: 20px; cursor: pointer; }
        
        .input { width: 100%; padding: 15px; border-radius: 15px; border: 1px solid #D2E8CF; 
                 background: white; font-size: 16px; margin: 10px 0; font-family: inherit; }
        .tea-type { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
        .tea-type-btn { padding: 10px 15px; border: 2px solid #D2E8CF; background: white; 
                       border-radius: 20px; cursor: pointer; transition: all 0.3s; }
        .tea-type-btn.active { background: #228B22; color: white; border-color: #228B22; }
        
        #feed { max-height: 500px; overflow-y: auto; }
        .back-btn { background: linear-gradient(45deg, #808080, #A9A9A9); font-size: 14px; padding: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍵 ChaClub</h1>
            <div style="font-size: 14px; opacity: 0.8;">Сообщество Чайных Мастеров</div>
        </div>

        <!-- ГЛАВНЫЙ ЭКРАН: ЛЕНТА ПОСТОВ -->
        <div class="screen" id="mainScreen">
            <h3>📜 Лента мастеров</h3>
            <div id="feed"></div>
            <button class="btn" onclick="showNewPost()">✨ Новый пост</button>
            <button class="btn btn-secondary" onclick="showTeaGuide()">📚 Руководство по чаям</button>
            <button class="btn btn-secondary" onclick="showProfile()">👤 Мой профиль</button>
        </div>

        <!-- НОВЫЙ ПОСТ -->
        <div class="screen" id="newPost">
            <h3>✨ Новый чайный пост</h3>
            <textarea class="input" id="postText" placeholder="Что заварили сегодня? Опишите сессию..."></textarea>
            <div>Тип чая:</div>
            <div class="tea-type">
                <div class="tea-type-btn" data-type="white">Белый чай</div>
                <div class="tea-type-btn" data-type="green">Зелёный чай</div>
                <div class="tea-type-btn" data-type="yellow">Жёлтый чай</div>
                <div class="tea-type-btn" data-type="oolong">Улун</div>
                <div class="tea-type-btn" data-type="red">Красный чай</div>
                <div class="tea-type-btn" data-type="black">Чёрный чай</div>
                <div class="tea-type-btn" data-type="puer">Пуэр</div>
            </div>
            <input class="input" id="brewInfo" placeholder="95°C × 15с × 12 проливов">
            <button class="btn" onclick="publishPost()">🌿 Опубликовать</button>
            <button class="btn back-btn" onclick="showMain()">← Назад</button>
        </div>

        <!-- РУКОВОДСТВО ПО ЧАЯМ -->
        <div class="screen" id="teaGuide">
            <h3>📚 6 основных видов чая</h3>
            <div style="font-size: 14px; line-height: 1.5; max-height: 400px; overflow-y: auto;">
                <div class="tea-type-btn" style="font-size: 16px; margin: 15px 0; cursor: default;" onclick="showTeaDetails('white')">🍃 Белый чай</div>
                <div class="tea-type-btn" style="font-size: 16px; margin: 15px 0; cursor: default;" onclick="showTeaDetails('green')">🍵 Зелёный чай</div>
                <div class="tea-type-btn" style="font-size: 16px; margin: 15px 0; cursor: default;" onclick="showTeaDetails('yellow')">🌾 Жёлтый чай</div>
                <div class="tea-type-btn" style="font-size: 16px; margin: 15px 0; cursor: default;" onclick="showTeaDetails('oolong')">🌀 Улун</div>
                <div class="tea-type-btn" style="font-size: 16px; margin: 15px 0; cursor: default;" onclick="showTeaDetails('red')">🔴 Красный чай</div>
                <div class="tea-type-btn" style="font-size: 16px; margin: 15px 0; cursor: default;" onclick="showTeaDetails('black')">⚫ Чёрный чай</div>
                <div class="tea-type-btn" style="font-size: 16px; margin: 15px 0; cursor: default;" onclick="showTeaDetails('puer')">🌲 Пуэр</div>
            </div>
            <button class="btn back-btn" onclick="showMain()">← Назад</button>
        </div>

        <!-- ПРОФИЛЬ -->
        <div class="screen" id="profile">
            <h3>👤 Ваш профиль</h3>
            <p><strong>@</strong><span id="username">tea_master</span></p>
            <p><strong>Постов:</strong> <span id="postCount">0</span></p>
            <button class="btn" onclick="showNewPost()">✨ Новый пост</button>
            <button class="btn back-btn" onclick="showMain()">← Лента</button>
        </div>

        <!-- ДЕТАЛИ ЧАЯ -->
        <div class="screen" id="teaDetails" style="display: none;">
            <h3 id="teaTitle"></h3>
            <div id="teaInfo" style="font-size: 14px; line-height: 1.6; padding: 20px; background: #F0F8F0; border-radius: 15px;"></div>
            <button class="btn back-btn" onclick="showTeaGuide()">← К типам чая</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();
        
        const user = tg.initDataUnsafe.user || { id: Math.floor(Math.random() * 1000000), username: 'tea_master_' + Math.floor(Math.random() * 1000) };
        let posts = [];
        let currentTeaType = '';

        // 6 ОСНОВНЫХ ВИДОВ ЧАЯ (по artoftea.ru)
        const teaTypes = {
            white: {
                title: "🍃 Белый чай",
                info: "Белый чай — самый нежный из всех. Листья подвергаются минимальной обработке: только увяливание и сушка. Сохраняет максимум полезных веществ. Идеален для новичков. Заваривание: 75-85°C, 2-3 минуты, 3-5 проливов."
            },
            green: {
                title: "🍵 Зелёный чай", 
                info: "Зелёный чай фиксируется паром или обжаривается для остановки окисления. Сотни сортов: Лунцзин, Билочунь, Матча. Тонкий вкус требует правильной температуры. Заваривание: 70-85°C, 1-2 минуты, 2-4 пролива."
            },
            yellow: {
                title: "🌾 Жёлтый чай",
                info: "Редкий вид между зелёным и белым. Добавляется этап 'тюнь хуан' — завяливание в ткани. Мягкий вкус без горечи. Заваривание: 80-90°C, 2-3 минуты, 3 пролива."
            },
            oolong: {
                title: "🌀 Улун",
                info: "Частично ферментированный. От лёгкого Тиегуаньинь (10%) до темного Да Хун Пао (70%). Обработка: скручивание, ферментация, обжарка. Заваривание: 85-100°C, 20-60 сек, 6-10 проливов."
            },
            red: {
                title: "🔴 Красный чай",
                info: "В Китае называют 'хун ча'. Полная ферментация 90-100%. Классика: Цимэнь, Цюэшань. Мягкий сладкий вкус. Заваривание: 90-100°C, 2-3 минуты, 3-5 проливов."
            },
            black: {
                title: "⚫ Чёрный чай",
                info: "Полная ферментация + скручивание. Классика: Лапсанг Сушонг, Кашмир. Насыщенный вкус. Заваривание: 95-100°C, 3-5 минут, 2-3 пролива."
            },
            puer: {
                title: "🌲 Пуэр",
                info: "Уникальный постферментированный чай из Юньнани. Шэн (сырой) и Шу (зрелый). Улучшается с возрастом. Заваривание: Шэн 85-95°C, Шу 95-100°C, 10-30 сек, 10-20 проливов."
            }
        };

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            document.getElementById(screenId).style.display = 'block';
        }

        function showMain() {
            showScreen('mainScreen');
            renderFeed();
            tg.MainButton.setText('✨ Новый пост').show().onClick(() => showNewPost());
        }

        function renderFeed() {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            
            // Генерируем фейковые посты + пользовательские
            const allPosts = [...getDemoPosts(), ...posts].slice(0, 10);
            
            allPosts.forEach(post => {
                const postEl = document.createElement('div');
                postEl.className = 'post-card';
                postEl.onclick = () => tg.showAlert(post.text + '\n\n' + post.brew);
                postEl.innerHTML = `
                    <div class="post-header">${post.author}</div>
                    <div class="post-tea">${post.teaType}</div>
                    <div class="post-brew">${post.brew}</div>
                    <div style="font-size: 14px; opacity: 0.8; margin-top: 10px;">${post.text}</div>
                    <div class="post-actions">
                        <button class="action-btn">❤️ ${post.likes || 0}</button>
                        <button class="action-btn">💬</button>
                    </div>
                `;
                feed.appendChild(postEl);
            });
        }

        function getDemoPosts() {
            return [
                {author: '@tea_master_ivan', teaType: 'Шу Пуэр Дик Гуй', brew: '95°C × 15с × 12 проливов', text: '12 проливов чистого шоколада. Стрик 127 дней.', likes: 42},
                {author: '@puer_lord', teaType: 'Шэн Мэнку 2012', brew: '90°C × 10с × 15 проливов', text: '300-летние деревья Булан. Камфора в послевкусии.', likes: 28}
            ];
        }

        function showNewPost() {
            showScreen('newPost');
            document.querySelectorAll('.tea-type-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.onclick = (e) => {
                    document.querySelectorAll('.tea-type-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentTeaType = e.target.dataset.type;
                };
            });
        }

        function publishPost() {
            const text = document.getElementById('postText').value || 'Медитация с чаем ☕';
            const brew = document.getElementById('brewInfo').value || 'заварили по правилам';
            
            if (!currentTeaType) {
                tg.showAlert('Выберите тип чая!');
                return;
            }

            posts.unshift({
                author: '@' + user.username,
                teaType: teaTypes[currentTeaType].title,
                brew,
                text,
                likes: 0,
                timestamp: new Date().toLocaleString()
            });

            document.getElementById('postText').value = '';
            document.getElementById('brewInfo').value = '';
            currentTeaType = '';
            document.querySelectorAll('.tea-type-btn').forEach(btn => btn.classList.remove('active'));
            
            showMain();
            tg.HapticFeedback.notificationOccurred('success');
            tg.showAlert('✅ Пост опубликован в ленту!');
        }

        function showTeaGuide() {
            showScreen('teaGuide');
        }

        function showTeaDetails(type) {
            document.getElementById('teaTitle').textContent = teaTypes[type].title;
            document.getElementById('teaInfo').innerHTML = teaTypes[type].info;
            showScreen('teaDetails');
        }

        function showProfile() {
            showScreen('profile');
            document.getElementById('username').textContent = user.username;
            document.getElementById('postCount').textContent = posts.length;
        }

        // Инициализация
        document.getElementById('username').textContent = user.username;
        showMain();
        tg.CloudStorage.setCloudStorageAutoSync(true);
    </script>
</body>
</html>
