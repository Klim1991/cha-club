<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChaClub — Соцсеть Чайных Мастеров</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #F5F5F3 0%, #E8F5E8 50%, #D2E8CF 100%);
            color: #2D5016; min-height: 100vh; padding-bottom: 80px;
        }
        .container { max-width: 400px; margin: 0 auto; padding: 20px; }
        .header { 
            text-align: center; padding: 20px 0; 
            background: rgba(255,248,220,0.8); border-radius: 20px; margin-bottom: 20px;
            border: 1px solid rgba(210,232,207,0.5);
        }
        h1 { font-size: 28px; background: linear-gradient(45deg, #8B4513, #228B22); 
             -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .screen { 
            background: rgba(255,255,255,0.9); border-radius: 20px; padding: 25px; 
            margin-bottom: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border: 1px solid rgba(210,232,207,0.5); display: none;
        }
        #mainScreen { display: block; }
        
        .btn { 
            background: linear-gradient(45deg, #228B22, #32CD32); color: white; 
            border: none; padding: 15px 20px; border-radius: 15px; 
            font-size: 16px; font-weight: bold; width: 100%; margin: 8px 0;
            transition: all 0.3s; cursor: pointer; box-shadow: 0 4px 15px rgba(34,139,34,0.3);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(34,139,34,0.4); }
        .btn-secondary { background: linear-gradient(45deg, #DAA520, #F4A460) !important; }
        .btn-danger { background: linear-gradient(45deg, #DC143C, #B22222) !important; }
        .btn-admin { background: linear-gradient(45deg, #8B4513, #A0522D) !important; }
        
        .post-card { 
            background: white; border-radius: 15px; padding: 20px; margin: 15px 0;
            border-left: 5px solid #228B22; box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .post-header { font-weight: bold; color: #8B4513; margin-bottom: 10px; cursor: pointer; }
        .post-tea { font-size: 16px; color: #228B22; margin-bottom: 8px; }
        .post-brew { background: #E8F5E8; padding: 8px; border-radius: 10px; font-weight: bold; }
        .post-image { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; margin: 10px 0; }
        .post-actions { display: flex; justify-content: space-between; margin-top: 15px; }
        .action-btn { background: none; border: none; font-size: 20px; cursor: pointer; }
        
        .profile-header { text-align: center; padding: 30px 0; background: linear-gradient(135deg, #F0F8F0, #E8F5E8); border-radius: 20px; margin-bottom: 20px; }
        .profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: #D2E8CF; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        .profile-stats { display: flex; justify-content: space-around; margin: 20px 0; }
        .stat { text-align: center; font-weight: bold; }
        
        .input { width: 100%; padding: 15px; border-radius: 15px; border: 1px solid #D2E8CF; 
                 background: white; font-size: 16px; margin: 10px 0; font-family: inherit; }
        .tea-type { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
        .tea-type-btn { padding: 10px 15px; border: 2px solid #D2E8CF; background: white; 
                       border-radius: 20px; cursor: pointer; transition: all 0.3s; }
        .tea-type-btn.active { background: #228B22; color: white; border-color: #228B22; }
        
        #feed, #profileFeed, #chatMessages { max-height: 500px; overflow-y: auto; }
        .back-btn { background: linear-gradient(45deg, #808080, #A9A9A9); font-size: 14px; padding: 10px; }
        .chat-message { background: #F0F8F0; padding: 15px; margin: 10px 0; border-radius: 15px; }
        .chat-message.me { background: #228B22; color: white; margin-left: 20px; }
        .admin-list { max-height: 300px; overflow-y: auto; }
        .admin-item { display: flex; justify-content: space-between; padding: 15px; background: #F0F8F0; margin: 10px 0; border-radius: 10px; }
        .photo-preview { width: 100%; height: 150px; object-fit: cover; border-radius: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍵 ChaClub</h1>
            <div style="font-size: 14px; opacity: 0.8;">Соцсеть Чайных Мастеров</div>
        </div>

        <!-- ГЛАВНЫЙ ЭКРАН -->
        <div class="screen" id="mainScreen">
            <h3>📜 Лента мастеров</h3>
            <div id="feed"></div>
            <button class="btn" onclick="showNewPost()">✨ Новый пост</button>
            <button class="btn btn-secondary" onclick="showChat()">💬 Чат</button>
            <button class="btn btn-secondary" onclick="showProfile()">👤 Мой профиль</button>
            <button class="btn btn-admin" onclick="showAdmin()" id="adminBtn" style="display:none;">⚙️ Админ</button>
        </div>

        <!-- НОВЫЙ ПОСТ С ФОТО -->
        <div class="screen" id="newPost">
            <h3>✨ Новый чайный пост</h3>
            <input type="file" id="postPhoto" accept="image/*" style="display:none;" onchange="previewPhoto()">
            <div class="photo-preview" id="photoPreview" style="display:none;"></div>
            <button class="btn btn-secondary" onclick="document.getElementById('postPhoto').click()">📸 Добавить фото</button>
            <textarea class="input" id="postText" placeholder="Что заварили сегодня? Опишите сессию..."></textarea>
            <div>Тип чая:</div>
            <div class="tea-type">
                <div class="tea-type-btn" data-type="white">Белый чай</div>
                <div class="tea-type-btn" data-type="green">Зелёный чай</div>
                <div class="tea-type-btn" data-type="yellow">Жёлтый чай</div>
                <div class="tea-type-btn" data-type="oolong">Улун</div>
                <div class="tea-type-btn" data-type="red">Красный чай</div>
                <div class="tea-type-btn" data-type="black">Чёрный чай</div>
                <div class="tea-type-btn" data-type="puer">Пуэр</div>
            </div>
            <input class="input" id="brewInfo" placeholder="95°C × 15с × 12 проливов">
            <button class="btn" onclick="publishPost()">🌿 Опубликовать</button>
            <button class="btn back-btn" onclick="showMain()">← Назад</button>
        </div>

        <!-- ЛИЧНЫЙ ПРОФИЛЬ -->
        <div class="screen" id="profileScreen">
            <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar">👤</div>
                <h2 id="profileName">@tea_master</h2>
                <div style="font-size: 14px; opacity: 0.8; margin-bottom: 10px;" id="profileBio">Чайный мастер</div>
                <div style="font-size: 14px; color: #666;" id="profileSpecialty"></div>
                <div class="profile-stats">
                    <div class="stat"><div style="font-size: 24px;" id="profilePosts">0</div>Постов</div>
                    <div class="stat"><div style="font-size: 24px;" id="profileFollowers">12</div>Подписчиков</div>
                </div>
                <button class="btn btn-secondary" onclick="showProfileSettings()">✏️ Настроить профиль</button>
            </div>
            <div id="profileFeed"></div>
            <button class="btn back-btn" onclick="showMain()">← Лента</button>
        </div>

        <!-- НАСТРОЙКИ ПРОФИЛЯ -->
        <div class="screen" id="profileSettings">
            <h3>⚙️ Настройки профиля</h3>
            <input class="input" id="profileNameInput" placeholder="Имя профиля">
            <textarea class="input" id="profileBioInput" placeholder="Био: ваш чайный путь..."></textarea>
            <input class="input" id="profileTeaSpecialty" placeholder="Специализация">
            <input class="input" id="profileExperience" placeholder="Опыт (лет):" type="number">
            <button class="btn" onclick="saveProfile()">💾 Сохранить</button>
            <button class="btn back-btn" onclick="showProfileScreen()">← Профиль</button>
        </div>

        <!-- ЧАТ -->
        <div class="screen" id="chatScreen">
            <h3>💬 Общий чат</h3>
            <div id="chatMessages"></div>
            <div style="display: flex; gap: 10px;">
                <input class="input" id="chatInput" placeholder="Написать в чат..." style="flex:1;">
                <button class="btn" onclick="sendChatMessage()" style="padding:15px 20px; flex-shrink:0;">Отправить</button>
            </div>
            <button class="btn back-btn" onclick="showMain()">← Лента</button>
        </div>

        <!-- АДМИН ПАНЕЛЬ (ТОЛЬКО ДЛЯ ТЕБЯ) -->
        <div class="screen" id="adminPanel">
            <h3>👑 Админ панель</h3>
            <p style="background:#228B22;color:white;padding:10px;border-radius:10px;">Только для ID: 6902824637</p>
            <div class="admin-list" id="adminUsers"></div>
            <button class="btn btn-danger" onclick="deleteAllPosts()">🗑️ Удалить все посты</button>
            <button class="btn btn-danger" onclick="deleteAllChats()">🗑️ Очистить чат</button>
            <button class="btn back-btn" onclick="showMain()">← Главная</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();
        
        const user = tg.initDataUnsafe.user || { 
            id: Math.floor(Math.random() * 1000000), 
            username: 'tea_master_' + Math.floor(Math.random() * 1000) 
        };
        
        // 🔥 АДМИН ТОЛЬКО ТЫ!
        const ADMIN_ID = 6902824637;
        
        let posts = [], chats = [], users = {};
        let currentTeaType = '', currentProfileUser = null;

        // Инициализация
        function initUser() {
            if (!users[user.id]) {
                users[user.id] = {
                    id: user.id,
                    username: user.username || `user_${user.id.slice(-4)}`,
                    name: 'Чайный мастер',
                    bio: 'Любитель чая ☕',
                    specialty: '',
                    experience: 0,
                    posts: 0,
                    followers: Math.floor(Math.random() * 50) + 10,
                    avatar: '👤'
                };
            }
            loadData();
            
            // Админка ТОЛЬКО ДЛЯ ТЕБЯ
            if (user.id == ADMIN_ID) {
                document.getElementById('adminBtn').style.display = 'block';
            }
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            document.getElementById(screenId).style.display = 'block';
            tg.MainButton.hide();
        }

        function showMain() {
            showScreen('mainScreen');
            renderFeed();
            tg.MainButton.setText('✨ Новый пост').show().onClick(showNewPost);
        }

        function renderFeed() {
            const feed = document.getElementById('feed');
            feed.innerHTML = posts.slice(0, 20).map(post => `
                <div class="post-card">
                    <div class="post-header" onclick="showUserProfile(${post.userId})">@${post.author}</div>
                    ${post.image ? `<img src="${post.image}" class="post-image" onclick="tg.showAlert('📸 Фото чая')>` : ''}
                    <div class="post-tea">${post.teaType}</div>
                    <div class="post-brew">${post.brew}</div>
                    <div style="font-size: 14px; opacity: 0.8; margin: 10px 0;">${post.text}</div>
                    <div class="post-actions">
                        <button class="action-btn">❤️ ${post.likes || 0}</button>
                        <button class="action-btn">💬 ${post.comments || 0}</button>
                    </div>
                    ${user.id == ADMIN_ID ? `<button class="btn btn-danger" style="font-size:12px;padding:5px;margin-top:10px;" onclick="deletePost(${post.id})">Удалить</button>` : ''}
                </div>
            `).reverse().join('');
        }

        function showUserProfile(userId) {
            currentProfileUser = userId;
            const profileUser = users[userId];
            document.getElementById('profileAvatar').textContent = profileUser.avatar;
            document.getElementById('profileName').textContent = '@' + profileUser.username;
            document.getElementById('profileBio').textContent = profileUser.bio;
            document.getElementById('profileSpecialty').textContent = profileUser.specialty ? `🎯 ${profileUser.specialty}` : '';
            document.getElementById('profilePosts').textContent = profileUser.posts;
            document.getElementById('profileFollowers').textContent = profileUser.followers;
            renderProfileFeed(userId);
            showScreen('profileScreen');
        }

        function renderProfileFeed(userId) {
            const feed = document.getElementById('profileFeed');
            const userPosts = posts.filter(p => p.userId == userId);
            feed.innerHTML = userPosts.length ? userPosts.map(post => `
                <div class="post-card">
                    ${post.image ? `<img src="${post.image}" class="post-image">` : ''}
                    <div class="post-tea">${post.teaType}</div>
                    <div class="post-brew">${post.brew}</div>
                    <div style="font-size: 14px; opacity: 0.8;">${post.text}</div>
                </div>
            `).join('') : '<div style="text-align:center;opacity:0.6;padding:40px;">Пока нет постов ☕</div>';
        }

        function previewPhoto() {
            const file = document.getElementById('postPhoto').files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('photoPreview').src = e.target.result;
                    document.getElementById('photoPreview').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function showNewPost() {
            showScreen('newPost');
            document.querySelectorAll('.tea-type-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.onclick = (e) => {
                    document.querySelectorAll('.tea-type-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentTeaType = e.target.dataset.type;
                };
            });
        }

        function publishPost() {
            if (!currentTeaType) return tg.showAlert('Выберите тип чая!');
            
            const text = document.getElementById('postText').value || 'Чайная сессия ☕';
            const brew = document.getElementById('brewInfo').value || 'по правилам';
            const file = document.getElementById('postPhoto').files[0];
            
            const post = {
                id: Date.now(),
                userId: user.id,
                author: users[user.id].username,
                teaType: `🍵 ${document.querySelector('.tea-type-btn.active')?.textContent || 'Чай'}`,
                brew,
                text,
                image: file ? URL.createObjectURL(file) : null,
                likes: 0,
                comments: 0
            };
            
            posts.unshift(post);
            users[user.id].posts++;
            saveData();
            
            // Очистка формы
            document.getElementById('postText').value = '';
            document.getElementById('brewInfo').value = '';
            document.getElementById('photoPreview').style.display = 'none';
            document.getElementById('postPhoto').value = '';
            currentTeaType = '';
            document.querySelectorAll('.tea-type-btn').forEach(btn => btn.classList.remove('active'));
            
            showMain();
            tg.HapticFeedback.notificationOccurred('success');
        }

        function showChat() {
            showScreen('chatScreen');
            renderChat();
            tg.MainButton.setText('Отправить').show().onClick(sendChatMessage);
        }

        function renderChat() {
            document.getElementById('chatMessages').innerHTML = chats.map(chat => 
                `<div class="chat-message ${chat.userId == user.id ? 'me' : ''}">
                    <strong>@${chat.author}:</strong> ${chat.text}
                </div>`
            ).join('');
            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
        }

        function sendChatMessage() {
            const text = document.getElementById('chatInput').value.trim();
            if (!text) return;
            
            chats.push({
                id: Date.now(),
                userId: user.id,
                author: users[user.id].username,
                text,
                timestamp: new Date().toLocaleTimeString()
            });
            
            document.getElementById('chatInput').value = '';
            saveData();
            renderChat();
        }

        function showProfile() { showUserProfile(user.id); }
        function showProfileSettings() {
            const u = users[user.id];
            document.getElementById('profileNameInput').value = u.name;
            document.getElementById('profileBioInput').value = u.bio;
            document.getElementById('profileTeaSpecialty').value = u.specialty;
            document.getElementById('profileExperience').value = u.experience;
            showScreen('profileSettings');
        }
        
        function saveProfile() {
            const u = users[user.id];
            u.name = document.getElementById('profileNameInput').value || u.name;
            u.bio = document.getElementById('profileBioInput').value || u.bio;
            u.specialty = document.getElementById('profileTeaSpecialty').value;
            u.experience = parseInt(document.getElementById('profileExperience').value) || 0;
            saveData();
            showProfile();
            tg.showAlert('✅ Профиль обновлён!');
        }

        function showAdmin() {
            showScreen('adminPanel');
            renderAdminPanel();
        }

        function renderAdminPanel() {
            const list = document.getElementById('adminUsers');
            list.innerHTML = Object.values(users).map(u => `
                <div class="admin-item">
                    <div>
                        <strong>@${u.username}</strong><br>
                        <small>${u.posts} постов • ${u.followers} подписчиков</small>
                    </div>
                    <button class="btn btn-danger" style="padding:8px 12px;font-size:12px;" onclick="banUser(${u.id})">БАН</button>
                </div>
            `).join('');
        }

        function deletePost(postId) {
            posts = posts.filter(p => p.id != postId);
            saveData();
            renderFeed();
            tg.showAlert('✅ Пост удалён');
        }

        function deleteAllPosts() {
            if (confirm('Удалить ВСЕ посты?')) {
                posts = [];
                saveData();
                renderFeed();
                tg.showAlert('🗑️ Лента очищена');
            }
        }

        function deleteAllChats() {
            if (confirm('Очистить чат?')) {
                chats = [];
                saveData();
                renderChat();
                tg.showAlert('🗑️ Чат очищен');
            }
        }

        function banUser(userId) {
            if (userId == user.id) return tg.showAlert('Нельзя забанить себя!');
            delete users[userId];
            posts = posts.filter(p => p.userId != userId);
            chats = chats.filter(c => c.userId != userId);
            saveData();
            renderAdminPanel();
            tg.showAlert('👋 Пользователь забанен');
        }

        function saveData() {
            localStorage.setItem('chaClubData', JSON.stringify({posts, chats, users}));
        }

        function loadData() {
            try {
                const data = JSON.parse(localStorage.getItem('chaClubData') || '{}');
                posts = data.posts || [];
                chats = data.chats || [];
                users = data.users || {};
            } catch(e) {}
        }

        // Инициализация
        initUser();
        showMain();
        tg.CloudStorage.setCloudStorageAutoSync(true);
    </script>
</body>
</html>
