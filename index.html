<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChaClub — Соцсеть Чайных Мастеров</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #F5F5F3 0%, #E8F5E8 50%, #D2E8CF 100%);
            color: #2D5016; min-height: 100vh; padding-bottom: 80px;
        }
        .container { max-width: 400px; margin: 0 auto; padding: 20px; }
        .header { 
            text-align: center; padding: 20px 0; 
            background: rgba(255,248,220,0.8); border-radius: 20px; margin-bottom: 20px;
            border: 1px solid rgba(210,232,207,0.5);
        }
        h1 { font-size: 28px; background: linear-gradient(45deg, #8B4513, #228B22); 
             -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .screen { 
            background: rgba(255,255,255,0.95); border-radius: 20px; padding: 25px; 
            margin-bottom: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border: 1px solid rgba(210,232,207,0.5); display: none;
        }
        #welcomeScreen { display: block; }
        
        .btn { 
            background: linear-gradient(45deg, #228B22, #32CD32); color: white; 
            border: none; padding: 15px 20px; border-radius: 15px; 
            font-size: 16px; font-weight: bold; width: 100%; margin: 8px 0;
            cursor: pointer; box-shadow: 0 4px 15px rgba(34,139,34,0.3);
            touch-action: manipulation;
        }
        .btn:active { transform: scale(0.98); }
        .btn-secondary { background: linear-gradient(45deg, #DAA520, #F4A460) !important; }
        .btn-danger { background: linear-gradient(45deg, #DC143C, #B22222) !important; }
        .btn-small { width: auto !important; padding: 10px 16px !important; margin: 4px; font-size: 14px !important; }
        
        .post-card { 
            background: white; border-radius: 15px; padding: 20px; margin: 15px 0;
            border-left: 5px solid #228B22; box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            cursor: pointer;
        }
        .post-actions button { 
            background: #F0F8F0; border: 2px solid #D2E8CF; color: #228B22; 
            padding: 12px; border-radius: 12px; font-size: 18px; font-weight: bold;
            min-width: 70px; margin: 0 5px; cursor: pointer;
        }
        .post-actions button:active { background: #228B22 !important; color: white !important; }
        .post-actions button.liked { background: #FF6B6B !important; color: white !important; }
        
        #feed { max-height: 60vh; overflow-y: auto; padding-right: 10px; }
        .back-btn { background: linear-gradient(45deg, #808080, #A9A9A9) !important; }
        .input, textarea { 
            width: 100%; padding: 15px; border-radius: 15px; border: 1px solid #D2E8CF; 
            background: white; font-size: 16px; margin: 10px 0; box-sizing: border-box;
        }
        textarea { height: 120px; resize: vertical; }
        .profile-avatar { 
            width: 90px; height: 90px; border-radius: 50%; background: #D2E8CF; 
            margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; 
            font-size: 35px; border: 4px solid #228B22; cursor: pointer;
        }
        #mainScreen { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <!-- ЭКРАН ПРИВЕТСТВИЯ -->
        <div class="screen" id="welcomeScreen">
            <div class="header">
                <h1>🍵 ChaClub</h1>
                <p style="font-size: 14px; opacity: 0.8;">Соцсеть чайных мастеров</p>
            </div>
            <div style="background: #E8F5E8; padding: 20px; border-radius: 15px; margin: 20px 0; text-align: center;">
                <div style="font-size: 16px; margin-bottom: 10px;">
                    👤 <strong id="welcomeUser">@username</strong>
                </div>
                <div style="font-size: 14px; opacity: 0.8;">
                    🌿 Постов: <strong id="welcomePosts">0</strong>
                </div>
            </div>
            <button class="btn" onclick="enterApp()" style="padding: 20px; font-size: 18px;">
                🚀 Войти в соцсеть
            </button>
        </div>

        <!-- ГЛАВНАЯ -->
        <div class="screen" id="mainScreen">
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button class="btn btn-small" onclick="setPostTarget('public')">🌐 Общая</button>
                <button class="btn btn-small btn-secondary" onclick="setPostTarget('profile')">👤 Мой</button>
            </div>
            <h3 id="feedTitle">📜 Лента</h3>
            <div id="feed"></div>
            <button class="btn" onclick="showNewPost()">✨ Новый пост</button>
            <button class="btn btn-secondary" onclick="showProfile()">👤 Профиль</button>
            <button class="btn btn-secondary" onclick="showNotifications()">🔔 (<span id="notifCount">0</span>)</button>
        </div>

        <!-- НОВЫЙ ПОСТ -->
        <div class="screen" id="newPostScreen">
            <h3>✨ Новый пост</h3>
            <div style="background: #E8F5E8; padding: 15px; border-radius: 12px; margin-bottom: 20px; font-size: 14px;">
                <strong id="postTargetText">Общая лента</strong>
            </div>
            <input type="file" id="postPhotoInput" accept="image/*" style="display:none;" onchange="previewPhoto(event)">
            <div id="photoPreview" style="display:none; width:100%; height:200px; object-fit:cover; border-radius:15px; margin:15px 0;"></div>
            <button class="btn btn-secondary" onclick="document.getElementById('postPhotoInput').click()">📸 Фото</button>
            <textarea id="postText" class="input" placeholder="Ваша чайная сессия... ☕"></textarea>
            <button class="btn" onclick="publishPost()">🌿 Опубликовать</button>
            <button class="btn back-btn" onclick="showMainScreen()">← Назад</button>
        </div>

        <!-- ПРОФИЛЬ -->
        <div class="screen" id="profileScreen">
            <div style="text-align:center; padding: 30px 0; background: linear-gradient(135deg, #F0F8F0, #E8F5E8); border-radius: 20px;">
                <div class="profile-avatar" id="profileAvatar" onclick="showProfileSettings()">👤</div>
                <h2 id="profileName">@username</h2>
                <div id="profileBio" style="font-size:14px; opacity:0.8;">Чайный мастер</div>
                <div style="font-size:14px; color:#666; margin-top:10px;">
                    Постов: <strong id="profilePostCount">0</strong> | 
                    Лайков: <strong id="profileLikeCount">0</strong>
                </div>
            </div>
            <h4>Мои посты</h4>
            <div id="profileFeed"></div>
            <button class="btn back-btn" onclick="showMainScreen()">← Лента</button>
        </div>

        <!-- НАСТРОЙКИ -->
        <div class="screen" id="profileSettingsScreen">
            <h3>⚙️ Настройки</h3>
            <input id="nameInput" class="input" placeholder="Имя">
            <input id="usernameInput" class="input" placeholder="@username">
            <input type="file" id="avatarInput" accept="image/*" style="display:none;" onchange="previewAvatar(event)">
            <div id="avatarPreview" style="width:80px;height:80px;border-radius:50%;margin:15px auto;display:none;"></div>
            <button class="btn btn-secondary" onclick="document.getElementById('avatarInput').click()">🖼️ Аватар</button>
            <button class="btn" onclick="saveProfile()">💾 Сохранить</button>
            <button class="btn back-btn" onclick="showProfileScreen()">← Профиль</button>
        </div>

        <!-- УВЕДОМЛЕНИЯ -->
        <div class="screen" id="notificationsScreen">
            <h3>🔔 Уведомления</h3>
            <div id="notificationsList" style="max-height:60vh;overflow-y:auto;"></div>
            <button class="btn back-btn" onclick="showMainScreen()">← Главная</button>
        </div>
    </div>

    <script>
        // ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();
        
        let appData = {
            user: tg.initDataUnsafe.user || { id: 12345, username: 'tea_master' },
            posts: [],
            users: {},
            notifications: [],
            postTarget: 'public'
        };

        // ✅ ИНИЦИАЛИЗАЦИЯ — ВСЕ КНОПКИ РАБОТАЮТ!
        function initApp() {
            console.log('🔥 ChaClub ИНИЦИАЛИЗАЦИЯ');
            createUser();
            loadData();
            updateWelcomeScreen();
            tg.CloudStorage.setCloudStorageAutoSync(true);
        }

        function createUser() {
            if (!appData.users[appData.user.id]) {
                appData.users[appData.user.id] = {
                    id: appData.user.id,
                    username: appData.user.username || 'tea_master_' + Math.floor(Math.random()*1000),
                    name: 'Чайный мастер',
                    avatar: '👤',
                    posts: 0,
                    totalLikes: 0
                };
            }
        }

        // ✅ ВСЕ ЭКРАНЫ
        function showScreen(screenId) {
            console.log('Показываем экран:', screenId);
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            document.getElementById(screenId).style.display = 'block';
        }

        function enterApp() {
            console.log('🚀 Вход в приложение');
            tg.HapticFeedback.impactOccurred('light');
            showScreen('mainScreen');
            renderFeed();
        }

        function showMainScreen() {
            showScreen('mainScreen');
            renderFeed();
        }

        function showNewPost() {
            document.getElementById('postText').value = '';
            document.getElementById('photoPreview').style.display = 'none';
            document.getElementById('postPhotoInput').value = '';
            document.getElementById('postTargetText').textContent = 
                appData.postTarget === 'public' ? '🌐 Общая лента' : '👤 Мой профиль';
            showScreen('newPostScreen');
        }

        function showProfileScreen() {
            updateProfileScreen();
            showScreen('profileScreen');
        }

        function showProfileSettings() {
            document.getElementById('nameInput').value = appData.users[appData.user.id].name;
            document.getElementById('usernameInput').value = '@' + appData.users[appData.user.id].username;
            document.getElementById('avatarPreview').style.display = 'none';
            showScreen('profileSettingsScreen');
        }

        function showNotifications() {
            renderNotifications();
            showScreen('notificationsScreen');
        }

        // ✅ ЛЕНТА ПОСТОВ
        function renderFeed() {
            const feed = document.getElementById('feed');
            const targetPosts = appData.postTarget === 'public' ? appData.posts : 
                appData.posts.filter(p => p.userId === appData.user.id);
            
            feed.innerHTML = targetPosts.map(post => `
                <div class="post-card">
                    <div style="font-weight:bold;color:#8B4513;margin-bottom:10px;cursor:pointer" 
                         onclick="showUserProfile(${post.userId})">@${post.author}</div>
                    ${post.image ? `<img src="${post.image}" style="width:100%;height:200px;object-fit:cover;border-radius:10px;">` : ''}
                    <div style="font-size:14px;line-height:1.4;margin:10px 0;">${post.text}</div>
                    <div style="font-size:12px;opacity:0.7;margin-bottom:15px;">${post.timestamp}</div>
                    <div class="post-actions" style="display:flex;justify-content:space-around;">
                        <button onclick="toggleLike(${post.id});event.stopPropagation()" 
                                class="${post.likes?.includes(appData.user.id) ? 'liked' : ''}">
                            ❤️ ${post.likes?.length || 0}
                        </button>
                        <button onclick="alert('💬 Комментарии в разработке');event.stopPropagation()">
                            💬 ${post.comments?.length || 0}
                        </button>
                    </div>
                </div>
            `).reverse().join('') || '<div style="text-align:center;padding:40px;opacity:0.5;">Нет постов. Создайте первый! ☕</div>';
            
            document.getElementById('feedTitle').textContent = 
                appData.postTarget === 'public' ? '📜 Общая лента' : '👤 Мои посты';
        }

        function setPostTarget(target) {
            appData.postTarget = target;
            document.querySelectorAll('#mainScreen button')[0].className = 
                target === 'public' ? 'btn btn-small' : 'btn btn-small btn-secondary';
            document.querySelectorAll('#mainScreen button')[1].className = 
                target === 'profile' ? 'btn btn-small' : 'btn btn-small btn-secondary';
            renderFeed();
            tg.HapticFeedback.selectionChanged();
        }

        // ✅ ЛАЙКИ РАБОТАЮТ!
        function toggleLike(postId) {
            const post = appData.posts.find(p => p.id === postId);
            if (!post) return;
            
            const likes = post.likes || [];
            if (likes.includes(appData.user.id)) {
                post.likes = likes.filter(id => id !== appData.user.id);
            } else {
                post.likes = [...likes, appData.user.id];
                addNotification(appData.posts.find(p => p.id === postId).userId, 
                    `Вам поставили лайк! ❤️`);
            }
            
            updateUserStats();
            saveData();
            renderFeed();
            tg.HapticFeedback.impactOccurred('medium');
        }

        // ✅ ПОСТЫ
        function previewPhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('photoPreview').src = e.target.result;
                    document.getElementById('photoPreview').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function publishPost() {
            const text = document.getElementById('postText').value.trim();
            if (!text) {
                tg.showAlert('📝 Напишите текст поста!');
                return;
            }
            
            const post = {
                id: Date.now(),
                userId: appData.user.id,
                author: appData.users[appData.user.id].username,
                text: text,
                image: document.getElementById('photoPreview').style.display === 'block' ? 
                       document.getElementById('photoPreview').src : null,
                likes: [],
                comments: [],
                timestamp: new Date().toLocaleString('ru-RU', {
                    day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
                })
            };
            
            appData.posts.unshift(post);
            appData.users[appData.user.id].posts++;
            updateUserStats();
            
            saveData();
            tg.showAlert('✅ Пост опубликован!');
            showNewPost();
        }

        // ✅ ПРОФИЛЬ
        function updateProfileScreen() {
            const userData = appData.users[appData.user.id];
            document.getElementById('profileAvatar').textContent = userData.avatar;
            document.getElementById('profileName').textContent = '@' + userData.username;
            document.getElementById('profileBio').textContent = userData.name;
            document.getElementById('profilePostCount').textContent = userData.posts || 0;
            document.getElementById('profileLikeCount').textContent = userData.totalLikes || 0;
            
            const profileFeed = document.getElementById('profileFeed');
            const myPosts = appData.posts.filter(p => p.userId === appData.user.id);
            profileFeed.innerHTML = myPosts.map(post => `
                <div class="post-card">
                    <div>${post.text.slice(0, 100)}${post.text.length > 100 ? '...' : ''}</div>
                    <div style="font-size:12px;opacity:0.7;">${post.timestamp} • ❤️ ${post.likes?.length || 0}</div>
                </div>
            `).reverse().join('') || '<div style="text-align:center;opacity:0.5;">Нет постов ☕</div>';
        }

        // ✅ УВЕДОМЛЕНИЯ
        function addNotification(userId, text) {
            appData.notifications.unshift({
                id: Date.now(),
                userId: userId,
                text: text,
                timestamp: new Date().toLocaleTimeString(),
                read: false
            });
            saveData();
        }

        function renderNotifications() {
            const list = document.getElementById('notificationsList');
            const myNotifs = appData.notifications.filter(n => n.userId === appData.user.id);
            list.innerHTML = myNotifs.map(n => `
                <div style="background:#FFF3CD;padding:15px;margin:10px 0;border-radius:12px;border-left:4px solid #FFC107;">
                    ${n.text}
                    <div style="font-size:12px;opacity:0.7;margin-top:8px;">${n.timestamp}</div>
                </div>
            `).join('') || '<div style="text-align:center;padding:40px;opacity:0.5;">Нет уведомлений 🔔</div>';
            
            document.getElementById('notifCount').textContent = myNotifs.filter(n => !n.read).length;
        }

        // ✅ АВАТАР И НАСТРОЙКИ
        function previewAvatar(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('avatarPreview').src = e.target.result;
                    document.getElementById('avatarPreview').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function saveProfile() {
            appData.users[appData.user.id].name = document.getElementById('nameInput').value || 'Чайный мастер';
            appData.users[appData.user.id].username = document.getElementById('usernameInput').value.replace('@', '') || 
                appData.users[appData.user.id].username;
            
            if (document.getElementById('avatarPreview').style.display === 'block') {
                appData.users[appData.user.id].avatar = '🖼️';
            }
            
            saveData();
            tg.showAlert('✅ Профиль сохранён!');
            showProfileScreen();
        }

        // ✅ УТИЛИТЫ
        function updateUserStats() {
            appData.users[appData.user.id].posts = appData.posts.filter(p => p.userId === appData.user.id).length;
            appData.users[appData.user.id].totalLikes = appData.posts
                .filter(p => p.userId === appData.user.id)
                .reduce((sum, p) => sum + (p.likes?.length || 0), 0);
        }

        function updateWelcomeScreen() {
            document.getElementById('welcomeUser').textContent = '@' + appData.users[appData.user.id].username;
            document.getElementById('welcomePosts').textContent = appData.posts.length;
        }

        function saveData() {
            localStorage.setItem('chaClubData', JSON.stringify(appData));
        }

        function loadData() {
            try {
                const data = localStorage.getItem('chaClubData');
                if (data) {
                    const parsed = JSON.parse(data);
                    appData.posts = parsed.posts || [];
                    appData.users = parsed.users || {};
                    appData.notifications = parsed.notifications || [];
                }
            } catch(e) {
                console.log('Новые данные');
            }
        }

        function showUserProfile(userId) {
            tg.showAlert(`👤 Профиль @${appData.users[userId]?.username || 'user'}`);
        }

        // ✅ СТАРТ ПРИЛОЖЕНИЯ
        window.addEventListener('load', initApp);
        tg.MainButton.setText('✨ Новый пост').onClick(showNewPost).hide();
    </script>
</body>
</html>
