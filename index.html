<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍵 ChaClub</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #f5f5f3, #e8f5e8);
  color: #2d5016;
  min-height: 100vh;
}
.container {
  max-width: 420px;
  margin: 0 auto;
  padding: 16px;
}
.screen {
  display: none;
  background: white;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 12px 36px rgba(0,0,0,.15);
}
h1 { text-align: center; margin-bottom: 16px; }

.btn {
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  border-radius: 16px;
  border: none;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  background: linear-gradient(135deg, #228b22, #32cd32);
  color: white;
}
.btn.secondary {
  background: linear-gradient(135deg, #daa520, #f4a460);
}
</style>
</head>

<body>

<div class="container">

<div id="welcomeScreen" class="screen">
  <h1>🍵 ChaClub</h1>
  <p style="text-align:center;margin-bottom:20px;">
    Добро пожаловать, <strong id="welcomeUser">@user</strong>
  </p>
  <button id="enterBtn" class="btn">🚀 Войти в ChaClub</button>
</div>

<div id="mainScreen" class="screen">
  <h1>📜 Лента</h1>
  <button id="profileBtn" class="btn secondary">👤 Профиль</button>
</div>

<div id="profileScreen" class="screen">
  <h1>👤 Профиль</h1>
  <p id="profileName"></p>
  <button id="backBtn" class="btn secondary">← Назад</button>
</div>

</div>

<script>
/* ===== TELEGRAM ===== */
const tg = window.Telegram?.WebApp || null;
if (tg) {
  tg.ready();
  tg.expand();
}

/* ===== STATE ===== */
const app = {
  user: tg?.initDataUnsafe?.user || {
    username: "guest_" + Math.floor(Math.random() * 1000)
  }
};

/* ===== INIT ===== */
window.addEventListener("DOMContentLoaded", init);

function init() {
  bindUI();
  updateWelcome();
  showScreen("welcomeScreen");
}

/* ===== UI ===== */
function bindUI() {
  document.getElementById("enterBtn").onclick = () => {
    showScreen("mainScreen");
  };

  document.getElementById("profileBtn").onclick = () => {
    document.getElementById("profileName").textContent =
      "@" + app.user.username;
    showScreen("profileScreen");
  };

  document.getElementById("backBtn").onclick = () => {
    showScreen("mainScreen");
  };
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => {
    s.style.display = "none";
  });
  document.getElementById(id).style.display = "block";
}

/* ===== LOGIC ===== */
function updateWelcome() {
  document.getElementById("welcomeUser").textContent =
    "@" + app.user.username;
}
</script>

</body>
</html>
