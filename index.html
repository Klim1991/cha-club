<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍵 ChaClub — Соцсеть Чайных Мастеров</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #f5f5f3, #e8f5e8);
    color: #2d5016;
    min-height: 100vh;
}
.container {
    max-width: 420px;
    margin: 0 auto;
    padding: 20px;
}
.screen {
    display: none;
    background: white;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,.12);
}
.screen.active { display: block; }

h1 {
    text-align: center;
    margin-bottom: 16px;
}

.btn {
    width: 100%;
    padding: 16px;
    margin-top: 12px;
    border-radius: 16px;
    border: none;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    background: linear-gradient(135deg, #228b22, #32cd32);
    color: white;
}

.btn.secondary {
    background: linear-gradient(135deg, #daa520, #f4a460);
}
</style>
</head>

<body>

<div class="container">

<!-- WELCOME -->
<div id="welcomeScreen" class="screen active">
    <h1>🍵 ChaClub</h1>
    <p style="text-align:center;margin-bottom:20px;">
        Добро пожаловать, <strong id="welcomeUser">@user</strong>
    </p>
    <button id="enterAppBtn" class="btn">
        🚀 Войти в ChaClub
    </button>
</div>

<!-- MAIN -->
<div id="mainScreen" class="screen">
    <h1>📜 Общая лента</h1>
    <button id="newPostBtn" class="btn">✨ Новый пост</button>
    <button id="profileBtn" class="btn secondary">👤 Профиль</button>
</div>

<!-- NEW POST -->
<div id="newPostScreen" class="screen">
    <h1>✨ Новый пост</h1>
    <textarea id="postTextInput"
        style="width:100%;height:120px;border-radius:12px;padding:12px;"
        placeholder="Расскажите о чайной сессии..."></textarea>
    <button id="publishPostBtn" class="btn">🌿 Опубликовать</button>
    <button id="backMainBtn" class="btn secondary">← Назад</button>
</div>

<!-- PROFILE -->
<div id="profileScreen" class="screen">
    <h1>👤 Профиль</h1>
    <p id="profileName"></p>
    <button id="backProfileBtn" class="btn secondary">← Назад</button>
</div>

</div>

<script>
/* ================= TELEGRAM ================= */
const tg = window.Telegram?.WebApp;
if (tg) {
    tg.ready();
    tg.expand();
}

/* ================= STATE ================= */
const app = {
    user: tg?.initDataUnsafe?.user || {
        id: Date.now(),
        username: "guest_" + Math.floor(Math.random() * 1000)
    },
    posts: []
};

/* ================= INIT ================= */
window.addEventListener("load", initApp);

function initApp() {
    bindButtons();
    updateWelcome();
}

/* ================= BUTTONS ================= */
function bindButtons() {
    document.getElementById("enterAppBtn")
        .addEventListener("click", enterApp);

    document.getElementById("newPostBtn")
        .addEventListener("click", () => show("newPostScreen"));

    document.getElementById("profileBtn")
        .addEventListener("click", showProfile);

    document.getElementById("publishPostBtn")
        .addEventListener("click", publishPost);

    document.getElementById("backMainBtn")
        .addEventListener("click", () => show("mainScreen"));

    document.getElementById("backProfileBtn")
        .addEventListener("click", () => show("mainScreen"));
}

/* ================= NAV ================= */
function show(id) {
    document.querySelectorAll(".screen")
        .forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

function enterApp() {
    show("mainScreen");
}

/* ================= LOGIC ================= */
function updateWelcome() {
    document.getElementById("welcomeUser").textContent =
        "@" + (app.user.username || "user");
}

function publishPost() {
    const text = document.getElementById("postTextInput").value.trim();
    if (!text) {
        alert("Напишите текст поста");
        return;
    }
    app.posts.push({
        id: Date.now(),
        text
    });
    document.getElementById("postTextInput").value = "";
    alert("Пост опубликован!");
    show("mainScreen");
}

function showProfile() {
    document.getElementById("profileName").textContent =
        "@" + (app.user.username || "user");
    show("profileScreen");
}
</script>

</body>
</html>
